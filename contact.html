<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>문의 — SEED IT</title>
<meta name="description" content="SEED IT에 공급망 운영을 문의하세요." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/site.css" />
<style>
.sec-contact{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:116px 0;background:linear-gradient(160deg,#43463d 0%,#2d302b 55%,#23251f 100%);position:relative;}
.sec-contact::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0px,rgba(255,255,255,.03) 1px,transparent 1px,transparent 28px);pointer-events:none;}
.sec-contact .wrap{position:relative;z-index:1;}
.sec-contact h2{font-size:clamp(34px,4.2vw,55px);font-weight:800;letter-spacing:-.02em;line-height:1.3;word-break:keep-all;}
.contact-split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
.contact-form-wrap{background:rgba(111,125,104,.1);border:1px solid rgba(111,125,104,.22);border-radius:14px;padding:32px 28px;}
.cform-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cform-group{margin-bottom:14px;}
.cform-label{display:block;font-size:12px;font-weight:600;color:rgba(111,125,104,.9);letter-spacing:.04em;margin-bottom:6px;}
.cform-input,.cform-select,.cform-textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(111,125,104,.25);border-radius:8px;padding:11px 13px;font-size:14px;color:rgba(255,255,255,.88);font-family:'Pretendard',sans-serif;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none;}
.cform-input::placeholder,.cform-textarea::placeholder{color:rgba(255,255,255,.22);}
.cform-input:focus,.cform-select:focus,.cform-textarea:focus{border-color:rgba(111,125,104,.7);background:rgba(111,125,104,.12);}
.cform-select{color:rgba(255,255,255,.28);}
.cform-select.selected{color:rgba(255,255,255,.88);}
.cform-select option{color:#1d1e19;background:#f3f4f1;}
.cform-textarea{resize:none;min-height:120px;line-height:1.65;}
.cform-submit{width:100%;margin-top:6px;padding:15px;background:var(--sage);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:'Pretendard',sans-serif;cursor:pointer;transition:background .2s;}
.cform-submit:hover{background:#7d8e74;}
@media(max-width:900px){
  .contact-split{grid-template-columns:1fr;gap:44px;}
  .cform-row{grid-template-columns:1fr;}
}
</style>
</head>
<body class="no-hero">

<div id="site-header" class="site-header"></div>
<div class="mobile-panel" id="mobilePanel"></div>

<section class="sec-contact" data-nav-theme="dark">
  <div class="wrap reveal">
    <div class="contact-split">

      <!-- 왼쪽: 텍스트 -->
      <div>
        <p class="eyebrow">Contact</p>
        <h2 style="color:#fff;">공급망 운영이<br />필요하신가요?</h2>
        <p class="section-sub" style="color:rgba(255,255,255,.65);margin:18px 0 0;">품목, 물량, 규격, 납품 기준을 알려주시면<br />검토하겠습니다.</p>
      </div>

      <!-- 오른쪽: 문의 양식 -->
      <div class="contact-form-wrap">
        <form onsubmit="return false;">
          <div class="cform-row">
            <div class="cform-group">
              <label class="cform-label">회사명</label>
              <input type="text" class="cform-input" placeholder="(주)회사명">
            </div>
            <div class="cform-group">
              <label class="cform-label">담당자명</label>
              <input type="text" class="cform-input" placeholder="홍길동">
            </div>
          </div>
          <div class="cform-row">
            <div class="cform-group">
              <label class="cform-label">연락처</label>
              <input type="tel" class="cform-input" placeholder="010-0000-0000">
            </div>
            <div class="cform-group">
              <label class="cform-label">이메일</label>
              <input type="email" class="cform-input" placeholder="name@company.com">
            </div>
          </div>
          <div class="cform-group">
            <label class="cform-label">문의 유형</label>
            <select class="cform-select" onchange="this.classList.toggle('selected',this.value!=='')">
              <option value="" disabled selected>선택해 주세요</option>
              <option value="supply">공급망 운영 문의</option>
              <option value="cold">냉동·냉장 보관 문의</option>
              <option value="logistics">물류 문의</option>
              <option value="other">기타</option>
            </select>
          </div>
          <div class="cform-group">
            <label class="cform-label">문의 내용</label>
            <textarea class="cform-textarea" placeholder="현재 공급망 운영 현황 및 문의 사항을 적어주세요."></textarea>
          </div>
          <button type="submit" class="cform-submit">문의 보내기</button>
        </form>
      </div>

    </div>
  </div>
</section>

<div id="site-footer" class="footer"></div>
<script src="assets/site.js"></script>
</body>
</html>
