<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회사 소개 | seed it</title>
<meta name="description" content="seed it 운영 현황 — 인원 2→14명, 일 평균 처리 물량 800kg→15톤." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/site.css" />
<style>
/* ── Numbers split ── */
.metrics-split{display:grid;grid-template-columns:1fr 1.3fr;gap:80px;align-items:center;}

/* left */
.metric-list{margin-top:44px;border-top:1px solid var(--line);}
.metric-item{padding:22px 0;border-bottom:1px solid var(--line);}
.metric-row{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);}
.metric-row .metric-item{border-bottom:none;padding-right:12px;}
.metric-row .metric-item+.metric-item{border-left:1px solid var(--line);padding-left:20px;padding-right:0;}
.metric-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;margin-bottom:10px;}
.metric-value{font-family:'Inter',sans-serif;font-size:clamp(26px,2.8vw,38px);font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1;}
.metric-value .munit{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px;}
.metric-sub{font-size:13px;color:var(--muted);margin-top:6px;}

/* right: stacked + chart */
.chart-legend{display:inline-flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.03em;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* bar top labels — positioned absolutely just above each bar */
.bar-top-labels{
  position:absolute;
  left:0;right:0;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  opacity:0;transition:opacity .4s ease 1.1s;
}
.chart-in .bar-top-labels{opacity:1;}
.btl{font-family:'Inter',sans-serif;font-size:15px;font-weight:800;}
.btl.staff{color:var(--olive);}
.btl.vol{color:var(--sage);}
/* 2024 labels: 10px above bar top (~23px) */
.btl-wrap-2024{bottom:calc(var(--zone)*0.196 + 10px);}
/* 현재 labels: 10px above bar top (zone*2 = full chart height) */
.btl-wrap-now{bottom:calc(var(--zone)*2 + 10px);}

/* chart area — fluid width */
.stacked-chart{
  --zone:120px;
  position:relative;
  overflow:visible;
  width:100%;
  height:calc(var(--zone)*2);
  border-bottom:1.5px solid #c5c8be;
}

/* bars */
.sbar{
  position:absolute;
  bottom:0;
  width:35%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  height:100%;
}
.sbar-1{left:0;}
.sbar-2{left:65%;}

.sseg{
  width:100%;
  transform-origin:bottom;
  transform:scaleY(0);
  transition:transform 1.4s cubic-bezier(.19,1,.22,1);
  transition-delay:calc(var(--di,0)*1ms);
}
.s-staff{background:var(--olive);}
.s-vol{background:var(--sage);}
/* rounded top only on topmost segment (staff) */
.s-staff{border-radius:3px 3px 0 0;}
/* heights via CSS calc on --zone */
.s-staff-2024{height:calc(var(--zone)*0.143);}  /* 14.3% of 120 = ~17px */
.s-vol-2024{height:calc(var(--zone)*0.053);}     /* 5.3% of 120 = ~6px */
.s-staff-now{height:var(--zone);}
.s-vol-now{height:var(--zone);}
.chart-in .sseg{transform:scaleY(1);}

/* growth badges inside 현재 bar segments */
.seg-label{
  position:absolute;
  left:0;right:0;
  z-index:10;
  display:flex;align-items:center;justify-content:center;
  font-family:'Pretendard',sans-serif;font-weight:800;
  font-size:24px;letter-spacing:.02em;
  color:rgba(255,255,255,.95);
  pointer-events:none;
  opacity:0;
  transform:translateY(16px);
  transition:opacity .5s ease 1.4s, transform .5s cubic-bezier(.19,1,.22,1) 1.4s;
}
.chart-in .seg-label{opacity:1;transform:translateY(0);}
/* staff: top half of bar */
.lbl-staff-now{top:0;height:var(--zone);}
/* vol: bottom half of bar */
.lbl-vol-now{top:var(--zone);height:var(--zone);}

/* trend line SVG overlay */
.trend-svg{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  overflow:visible;
  pointer-events:none;
}
/* line: from 2024 bar top to 현재 bar top
   2024 top y = 240 - (17+6) = 217   center x = 55
   현재  top y = 240 - 240   = 0     center x = 221  */
.trend-line{
  stroke:#000;stroke-width:1.5;fill:none;
  opacity:0;
  stroke-dasharray:1000;stroke-dashoffset:1000;
  transition:stroke-dashoffset 1.3s cubic-bezier(.19,1,.22,1) 1s, opacity .1s ease 1s;
}
.trend-dot{fill:#000;opacity:0;transition:opacity .3s ease 1.8s;}
.chart-in .trend-line{opacity:1;stroke-dashoffset:0;}
.chart-in .trend-dot{opacity:1;}

/* x-axis labels */
.chart-x-row{display:flex;justify-content:space-between;margin-top:10px;width:100%;}
.chart-x-label{width:35%;text-align:center;font-size:15px;font-weight:700;color:var(--muted);}

@media(max-width:900px){
  .metrics-split{grid-template-columns:1fr;gap:48px;}
  .stacked-chart{--zone:80px;}
}

/* ── Contact split layout ── */
.contact-split{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;}
.contact-form-wrap{background:rgba(111,125,104,.1);border:1px solid rgba(111,125,104,.22);border-radius:14px;padding:32px 28px;}
.cform-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cform-group{margin-bottom:14px;}
.cform-label{display:block;font-size:12px;font-weight:600;color:rgba(111,125,104,.85);letter-spacing:.04em;margin-bottom:6px;}
.cform-input,.cform-select,.cform-textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);border:1px solid rgba(111,125,104,.25);border-radius:8px;padding:11px 13px;font-size:14px;color:rgba(255,255,255,.88);font-family:'Pretendard',sans-serif;outline:none;transition:border-color .2s,background .2s;-webkit-appearance:none;appearance:none;}
.cform-input::placeholder,.cform-textarea::placeholder{color:rgba(255,255,255,.22);}
.cform-input:focus,.cform-select:focus,.cform-textarea:focus{border-color:rgba(111,125,104,.7);background:rgba(111,125,104,.12);}
.cform-select{color:rgba(255,255,255,.28);}
.cform-select.selected{color:rgba(255,255,255,.88);}
.cform-select option{color:#1d1e19;background:#f3f4f1;}
.cform-textarea{resize:none;min-height:110px;line-height:1.65;}
.cform-submit{width:100%;margin-top:6px;padding:15px;background:var(--sage);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;font-family:'Pretendard',sans-serif;cursor:pointer;transition:background .2s;}
.cform-submit:hover{background:#7d8e74;}
@media(max-width:900px){
  .contact-split{grid-template-columns:1fr;gap:44px;}
  .cform-row{grid-template-columns:1fr;}
}

/* ── Gallery Slideshow ── */
.sec-gallery{position:relative;height:100vh;overflow:hidden;background:#1a1b1d;}
.gallery-slide{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:0;transition:opacity 2s ease;}
.gallery-slide.active{opacity:1;}
.gallery-dots{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;}
.gallery-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:background .3s,transform .3s;}
.gallery-dot.active{background:#fff;transform:scale(1.3);}

/* ── Max throughput banner ── */
.chart-max-banner{
  margin-top:28px;
  background:var(--charcoal,#2d302b);
  border-radius:8px;
  padding:16px 24px;
  display:flex;
  align-items:center;
  gap:20px;
}
.chart-max-label{
  font-size:16px;
  font-weight:700;
  letter-spacing:.06em;
  color:rgba(255,255,255,.5);
  line-height:1.4;
  flex-shrink:0;
}
.chart-max-divider{
  width:1px;
  height:32px;
  background:rgba(255,255,255,.15);
  flex-shrink:0;
}
.chart-max-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.chart-max-value{
  font-family:'Inter',sans-serif;
  font-size:clamp(32px,3.5vw,46px);
  font-weight:800;
  letter-spacing:-.03em;
  color:#fff;
  line-height:1;
  text-align:center;
}
.chart-max-value span{
  font-size:.55em;
  font-weight:600;
  color:rgba(255,255,255,.6);
  margin-left:3px;
  letter-spacing:0;
}
.chart-max-sub{
  font-size:12px;
  color:rgba(255,255,255,.3);
  margin-top:6px;
  text-align:center;
}
</style>
</head>
<body>

<div id="site-header" class="site-header"></div>
<div class="mobile-panel" id="mobilePanel"></div>

<!-- ── Numbers ── -->
<section class="section" data-nav-theme="light" style="min-height:100vh;background:#fff;">
  <div class="wrap">
    <div class="metrics-split">

      <!-- Left: stats -->
      <div class="reveal">
        <p class="eyebrow" style="color:var(--muted);">Numbers</p>
        <h2>현장에서 쌓은<br />운영 기록</h2>
        <div class="metric-list">
          <div class="metric-item">
            <p class="metric-label">운영 기간</p>
            <div class="metric-value">2024~</div>
            <p class="metric-sub">소규모 작업 운영부터 월 300톤대까지</p>
          </div>
          <div class="metric-row">
            <div class="metric-item">
              <p class="metric-label">운영 인원</p>
              <div class="metric-value numbers-val" data-count="14">0<span class="munit">명</span></div>
              <p class="metric-sub">2명에서 시작</p>
            </div>
            <div class="metric-item">
              <p class="metric-label">일 평균 처리 물량</p>
              <div class="metric-value numbers-val" data-count="15">0<span class="munit">톤</span></div>
              <p class="metric-sub">800kg에서 성장</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right: stacked + line chart -->
      <div id="chart-unified" class="reveal d1">

        <!-- legend: 왼쪽 막대 위 -->
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--olive)"></span>운영 인원</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--sage)"></span>일 평균 처리 물량</span>
        </div>

        <!-- chart bars -->
        <div class="stacked-chart">

          <!-- 2024 bar -->
          <div class="sbar sbar-1">
            <div class="bar-top-labels btl-wrap-2024">
              <span class="btl staff">2명</span>
              <span class="btl vol">0.8톤</span>
            </div>
            <div class="sseg s-staff s-staff-2024" style="--di:200"></div>
            <div class="sseg s-vol   s-vol-2024"   style="--di:0"></div>
          </div>

          <!-- 현재 bar -->
          <div class="sbar sbar-2">
            <div class="bar-top-labels btl-wrap-now">
              <span class="btl staff">14명</span>
              <span class="btl vol">15톤</span>
            </div>
            <div class="sseg s-staff s-staff-now" style="--di:400"></div>
            <div class="sseg s-vol   s-vol-now"   style="--di:200"></div>
            <div class="seg-label lbl-staff-now">7배 ↑</div>
            <div class="seg-label lbl-vol-now">16배 ↑</div>
          </div>

        </div>

        <!-- x-axis labels -->
        <div class="chart-x-row">
          <div class="chart-x-label">2024</div>
          <div class="chart-x-label">현재</div>
        </div>


      <!-- max throughput banner -->
      <div class="chart-max-banner">
        <div class="chart-max-label">월 최대 처리 물량</div>
        <div class="chart-max-divider"></div>
        <div class="chart-max-body">
          <div class="chart-max-value">361<span>톤</span></div>
          <div class="chart-max-sub">Monthly peak throughput</div>
        </div>
      </div>

      </div><!-- end chart-unified -->

    </div>
  </div>
</section>


<!-- ── Gallery Slideshow ── -->
<section class="sec-gallery" data-nav-theme="dark">
  <div class="gallery-slide active" style="background-image:url('assets/images/gallery/site-01.jpg')"></div>
  <div class="gallery-slide" style="background-image:url('assets/images/gallery/site-03.jpg')"></div>
  <div class="gallery-slide" style="background-image:url('assets/images/gallery/site-04.jpg')"></div>
  <div class="gallery-slide" style="background-image:url('assets/images/gallery/site-05.jpg')"></div>
  <div class="gallery-dots">
    <div class="gallery-dot active"></div>
    <div class="gallery-dot"></div>
    <div class="gallery-dot"></div>
    <div class="gallery-dot"></div>
  </div>
</section>


<div id="site-footer" class="footer"></div>
<script src="assets/site.js"></script>
<script>
(function(){
  var chart = document.getElementById('chart-unified');
  if(!chart) return;
  new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting) e.target.classList.add('chart-in');
    });
  },{ threshold:0.3 }).observe(chart);
})();
</script>

<script>
(function(){
  var slides = document.querySelectorAll('.gallery-slide');
  var dots   = document.querySelectorAll('.gallery-dot');
  if(!slides.length) return;
  var cur = 0;
  function goTo(n){
    slides[cur].classList.remove('active');
    dots[cur].classList.remove('active');
    cur = (n + slides.length) % slides.length;
    slides[cur].classList.add('active');
    dots[cur].classList.add('active');
  }
  dots.forEach(function(dot, i){
    dot.addEventListener('click', function(){
      goTo(i);
      clearInterval(timer);
      timer = setInterval(function(){ goTo(cur+1); }, 2000);
    });
  });
  var timer = setInterval(function(){ goTo(cur+1); }, 2000);
})();
</script>
</body>
</html>
