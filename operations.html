<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>운영역량·인프라 — SEED IT</title>
<meta name="description" content="SEED IT의 D-1 운영 흐름과 온도대별 보관 인프라를 확인하세요." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="assets/site.css" />
<style>
/* ── D-1 Timeflow ── */
.sec-timeflow{padding:116px 0;background:#1a1b1d;min-height:100vh;display:flex;flex-direction:column;justify-content:center;}
.sec-timeflow .eyebrow{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.sec-timeflow .eyebrow::before{content:'';width:22px;height:1px;background:rgba(255,255,255,.22);flex-shrink:0;}
.d1-accent{color:#a8c4a2;letter-spacing:-.01em;}
.sec-timeflow h2{color:#fff;font-size:clamp(34px,4.2vw,55px);font-weight:800;letter-spacing:-.02em;line-height:1.3;margin-bottom:0;}
.timeflow-wrap{position:relative;margin-top:64px;}
.timeflow-grid{display:grid;grid-template-columns:repeat(5,1fr);}
.timeflow-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;max-width:150px;margin:0 auto;}
.timeflow-track{position:absolute;left:10%;right:10%;top:5px;height:1px;background:rgba(255,255,255,.12);}
.timeflow-track-fill{position:absolute;left:0;top:0;height:1px;width:0;background:#6f7a86;transition:width 1.8s cubic-bezier(.19,1,.22,1);}
.timeflow-wrap.active .timeflow-track-fill{width:100%;}
.timeflow-dot{width:11px;height:11px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.4);transform:scale(0);transition:transform .5s cubic-bezier(.19,1,.22,1),border-color .5s;transition-delay:calc(var(--i)*150ms);position:relative;z-index:1;}
.timeflow-wrap.active .timeflow-dot{transform:scale(1);border-color:#6f7a86;}
.timeflow-lbl{font-size:17px;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6);opacity:0;transition:opacity .5s cubic-bezier(.19,1,.22,1);transition-delay:calc(var(--i)*150ms + 120ms);}
.timeflow-wrap.active .timeflow-lbl{opacity:1;}
.timeflow-caption{margin-top:36px;font-size:13.5px;color:rgba(255,255,255,.5);max-width:480px;}

/* ── Temperature & Storage ── */
.sec-temp{padding:116px 0;min-height:88vh;display:flex;flex-direction:column;justify-content:center;background:var(--paper,#f6f5f1);}
.sec-temp .eyebrow{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#6f7a86;display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.sec-temp .eyebrow::before{content:'';width:22px;height:1px;background:#e5e7eb;flex-shrink:0;}
.sec-temp h2{font-size:clamp(34px,4.2vw,55px);font-weight:800;line-height:1.3;letter-spacing:-.02em;color:#0b0b0c;margin-bottom:0;word-break:keep-all;}
.temp-tiles-wrap{margin-top:48px;}
.temp-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:auto 300px;column-gap:10px;row-gap:0;}
.cold-chain-header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding-bottom:11px;margin-bottom:10px;}
.cold-chain-icon{font-size:22.5px;color:#38bdf8;line-height:1;}
.cold-chain-badge{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#0ea5e9;}
.cold-chain-desc{font-size:11.5px;color:#94a3b8;font-weight:400;letter-spacing:.01em;}
.cold-chain-line{flex:1;height:1px;background:linear-gradient(to right,rgba(14,165,233,.25),transparent);}
.room-header{grid-column:3;}
.temp-grid>.temp-tile{margin-top:10.5px;margin-bottom:10.5px;}
.cold-tiles-group{grid-column:1/3;display:grid;grid-template-columns:1fr 1fr;column-gap:10px;border:4.5px solid rgba(14,165,233,.3);border-radius:6px;padding:6px;}
.temp-tile.cold-tile::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(14,165,233,.1) 0%,transparent 45%);z-index:0;pointer-events:none;}
.temp-tile{position:relative;overflow:hidden;border-radius:2px;background:#202225;display:flex;align-items:flex-end;padding:16px 14px;transition:opacity .4s cubic-bezier(.19,1,.22,1);}
.temp-tile::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.6) 0%,rgba(0,0,0,.05) 60%,rgba(0,0,0,0) 100%);}
.temp-tile:hover{opacity:.88;}
.temp-tile-content{position:relative;z-index:1;}
.temp-tile-en{font-family:'Inter',sans-serif;font-size:19px;font-weight:700;color:rgba(255,255,255,.55);letter-spacing:.04em;margin-bottom:7px;}
.temp-tile-kr{font-size:26px;font-weight:600;color:rgba(255,255,255,.92);}
.temp-caption{margin-top:24px;font-size:14px;color:#6b7280;line-height:1.8;}

@media(max-width:760px){
  .timeflow-grid{display:flex;flex-direction:column;align-items:flex-start;gap:22px;}
  .timeflow-track{display:none;}
  .timeflow-item{max-width:none;margin:0;flex-direction:row;text-align:left;align-items:baseline;padding-left:16px;border-left:1px solid rgba(255,255,255,.12);gap:10px;}
  .timeflow-dot{position:absolute;left:-6px;top:6px;}
  .temp-tiles{grid-template-columns:1fr;height:auto;}
  .temp-tile{min-height:120px;}
}
</style>
</head>
<body class="no-hero">

<div id="site-header" class="site-header"></div>
<div class="mobile-panel" id="mobilePanel"></div>

<!-- ══════════ 1. D-1 발주부터 출고 마감까지 ══════════ -->
<section class="sec-timeflow" id="timeflow" data-nav-theme="dark">
  <div class="timeflow-video-bg">
    <video class="tfv-a" autoplay muted loop playsinline preload="auto"><source src="assets/videos/timeflow-bg.mp4" type="video/mp4"></video>
    <video class="tfv-b" muted playsinline preload="auto"><source src="assets/videos/timeflow-bg.mp4" type="video/mp4"></video>
  </div>
  <div class="wrap">
    <div class="reveal">
      <p class="eyebrow">Time-Critical</p>
      <h2><span class="d1-accent">D-1</span> 발주부터 출고 마감까지<br />시간을 맞춥니다.</h2>
    </div>
    <div class="timeflow-wrap reveal" id="timeflowWrap">
      <div class="timeflow-track"><div class="timeflow-track-fill"></div></div>
      <div class="timeflow-grid">
        <div class="timeflow-item"><div class="timeflow-dot" style="--i:0"></div><p class="timeflow-lbl" style="--i:0">발주 확인</p></div>
        <div class="timeflow-item"><div class="timeflow-dot" style="--i:1"></div><p class="timeflow-lbl" style="--i:1">작업 계획</p></div>
        <div class="timeflow-item"><div class="timeflow-dot" style="--i:2"></div><p class="timeflow-lbl" style="--i:2">작업 진행</p></div>
        <div class="timeflow-item"><div class="timeflow-dot" style="--i:3"></div><p class="timeflow-lbl" style="--i:3">라벨 확인</p></div>
        <div class="timeflow-item"><div class="timeflow-dot" style="--i:4"></div><p class="timeflow-lbl" style="--i:4">상차·출고</p></div>
      </div>
    </div>
    <p class="timeflow-caption reveal d1">작업량과 인력을 조율해 정해진 시간 안에서 출고 흐름을 맞춥니다.</p>
  </div>
</section>

<!-- ══════════ 2. 냉장·온도대·상온 보관 ══════════ -->
<section class="sec-temp" id="temperature" data-nav-theme="light">
  <div class="wrap">
    <div class="reveal">
      <p class="eyebrow">Temperature &amp; Storage</p>
      <h2>냉동·냉장·상온 조건에 맞춰<br />보관 방식 구분</h2>
    </div>
    <div class="temp-tiles-wrap reveal d1">
      <div class="temp-grid">
        <!-- 라벨 행: 콜드체인 2칸, 상온 1칸 -->
        <div class="cold-chain-header">
          <span class="cold-chain-icon">❄</span>
          <span class="cold-chain-badge">Cold Chain</span>
          <div class="cold-chain-line"></div>
        </div>
        <div class="room-header"></div>
        <!-- 타일 행: cold-chain 2개 묶음 + 상온 1개 -->
        <div class="cold-tiles-group">
          <div class="temp-tile cold-tile" style="background-image:url('https://images.unsplash.com/photo-1592228533283-d78f7c1cf453?w=800&q=80&fit=crop');background-size:cover;background-position:center;">
            <div class="temp-tile-content">
              <p class="temp-tile-en">Frozen</p>
              <p class="temp-tile-kr">냉동 보관</p>
            </div>
          </div>
          <div class="temp-tile cold-tile" style="background-image:url('assets/images/gallery/cold-storage.jpg');background-size:cover;background-position:center;">
            <div class="temp-tile-content">
              <p class="temp-tile-en">Cold</p>
              <p class="temp-tile-kr">냉장 보관</p>
            </div>
          </div>
        </div>
        <div class="temp-tile" style="background-image:url('assets/images/gallery/room-storage.jpg');background-size:cover;background-position:center;">
          <div class="temp-tile-content">
            <p class="temp-tile-en">Room Temp</p>
            <p class="temp-tile-kr">상온 보관</p>
          </div>
        </div>
      </div>
    </div>
    <p class="temp-caption reveal">품목 특성과 작업 일정에 맞춰 보관 조건을 확인합니다.</p>
  </div>
</section>

<div id="site-footer" class="footer"></div>

<script src="assets/site.js"></script>
<script>
(function(){
  var wrap = document.getElementById('timeflowWrap');
  if(!wrap) return;
  new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      wrap.classList.add('active');
    });
  },{threshold:0.3}).observe(wrap);
})();
</script>
</body>
</html>
